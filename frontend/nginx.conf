server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and Swagger are proxied to the backend container, so the browser talks to a single origin.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }
  location /swagger-ui { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }

  # Single-page app: unknown paths fall back to index.html so React Router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
