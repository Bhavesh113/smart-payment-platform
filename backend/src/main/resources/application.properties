spring.application.name=smart-payment-platform
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never

# ---- Database (all credentials come from the environment, see .env.example) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartpay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:smartpay}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ---- Security / JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Payment rules (fraud / risk engine) ----
payment.max-transaction-limit=${PAYMENT_MAX_TRANSACTION_LIMIT:50000}
payment.daily-limit=${PAYMENT_DAILY_LIMIT:100000}
payment.velocity-limit=${PAYMENT_VELOCITY_LIMIT:5}
payment.velocity-window-minutes=${PAYMENT_VELOCITY_WINDOW_MINUTES:10}
payment.medium-risk-threshold=${PAYMENT_MEDIUM_RISK_THRESHOLD:20000}
payment.repeat-receiver-limit=${PAYMENT_REPEAT_RECEIVER_LIMIT:3}
payment.max-add-money=${PAYMENT_MAX_ADD_MONEY:100000}
payment.currency=INR
payment.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ---- Kafka ----
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.max-retries=${KAFKA_MAX_RETRIES:3}
app.kafka.retry-interval-ms=${KAFKA_RETRY_INTERVAL_MS:1000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=smartpay-consumers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartpay.platform.event

# ---- Seed data (demo users + sample transactions) ----
app.seed.enabled=${APP_SEED_ENABLED:false}

# ---- OpenAPI / actuator ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
